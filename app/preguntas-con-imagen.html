<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión · Preguntas con imagen</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background:#F7F7F7; color:#3C3C3C; }
  header { position:sticky; top:0; background:#58CC02; color:#fff; padding:14px 16px; font-weight:800; }
  header small { display:block; font-weight:400; opacity:.9; margin-top:2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background:#fff; border:2px solid #E5E5E5; border-radius:14px; padding:16px; margin:0 0 18px; }
  .id { font-size:.78rem; color:#1899D6; font-weight:700; }
  .ex { font-size:.78rem; color:#AFAFAF; margin-bottom:6px; }
  .q { font-weight:600; margin:4px 0 10px; }
  img.ecg { display:block; width:100%; max-width:640px; margin:6px auto; border:2px solid #E5E5E5; border-radius:12px; background:#fff; cursor:zoom-in; }
  ol { margin:8px 0 0; padding-left:20px; }
  ol li { margin:3px 0; }
  ol li.ok { color:#58A700; font-weight:700; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; padding:16px; z-index:9; }
  #lb img { max-width:100%; max-height:100%; border-radius:8px; background:#fff; }
  #lb.on { display:flex; }
</style>
</head>
<body>
<header>Preguntas con imagen <small id="sub">cargando…</small></header>
<div class="wrap" id="lista"></div>
<div id="lb"><img id="lbimg" alt=""></div>
<script src="data/db.js"></script>
<script>
  const lista = document.getElementById("lista");
  const conImg = window.DB.preguntas.filter(p => p.img);
  const examenes = Object.fromEntries(window.DB.examenes.map(e => [e.id, e.nombre]));
  document.getElementById("sub").textContent = conImg.length + " preguntas · toca una imagen para ampliarla";
  for (const p of conImg) {
    const c = document.createElement("div"); c.className = "card";
    let ops = "";
    for (const k of ["A","B","C","D"]) {
      if (!(k in p.o)) continue;
      ops += `<li class="${k===p.r?'ok':''}">${k}) ${p.o[k]}${k===p.r?' ✔':''}</li>`;
    }
    c.innerHTML = `<div class="id">${p.id}</div>
      <div class="ex">${examenes[p.ex]||p.ex}</div>
      <div class="q">${p.q}</div>
      <img class="ecg" src="${p.img}" alt="imagen de la pregunta" loading="lazy">
      <ol type="A">${ops}</ol>`;
    c.querySelector("img").onclick = () => { document.getElementById("lbimg").src = p.img; document.getElementById("lb").classList.add("on"); };
    lista.appendChild(c);
  }
  document.getElementById("lb").onclick = () => document.getElementById("lb").classList.remove("on");
</script>
</body>
</html>
